# 编译 Windows 版原生发送端。
#
# 为什么在 CI 编：sender 依赖 CGO（libopus + malgo），从 Mac 交叉编译
# 要自己配 mingw 工具链再从源码编一份 Windows 版 libopus；
# 而 MSYS2 有现成的 mingw-w64 opus 包，在 Windows runner 上装一下就完。
name: build-windows-binaries

on:
  push:
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - ".github/workflows/build-sender.yml"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-opus
            mingw-w64-x86_64-go

      - name: Build
        env:
          CGO_ENABLED: "1"
        run: |
          export GOROOT=/mingw64/lib/go
          export PATH=/mingw64/bin:$PATH
          go test ./internal/receiverconfig
          # 静态链接 opus，用户拿到单个 exe，不用带 DLL。
          # nolibopusfile：只用编解码，不链 opusfile（那是读 .opus 文件用的）
          go build -tags nolibopusfile -ldflags "-extldflags -static" -o relaymic-sender.exe ./cmd/sender
          # GUI 版：-H windowsgui 不弹黑色控制台窗口
          go build -tags nolibopusfile -ldflags "-H windowsgui -extldflags -static" -o 远程麦克风.exe ./cmd/sender-gui
          # Receiver 与 sender 共用 malgo/miniaudio；Windows 下会走原生音频后端。
          go build -tags nolibopusfile -ldflags "-extldflags -static" -o relaymic-receiver.exe ./cmd/receiver

      - uses: actions/upload-artifact@v4
        with:
          name: relaymic-windows
          path: |
            relaymic-sender.exe
            远程麦克风.exe
            relaymic-receiver.exe

  # 接收端 macOS 二进制：静态链接 opus，产物单文件免依赖，
  # 多台 Mac mini 部署时目标机只需要装 BlackHole，不用装 Go/brew opus。
  mac-receiver:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build
        run: |
          brew list opus >/dev/null 2>&1 || brew install opus
          # 把 .a 直接给链接器 + 剔除无引用 dylib = 强制静态链接 opus
          CGO_ENABLED=1 \
          CGO_LDFLAGS="$(brew --prefix opus)/lib/libopus.a -Wl,-dead_strip_dylibs" \
          go build -tags nolibopusfile -o relaymic-receiver ./cmd/receiver
          # 守卫：产物必须不依赖任何 brew 库，否则分发到别的机器就起不来
          if otool -L relaymic-receiver | grep -q /opt/homebrew; then
            echo "静态链接失败，产物仍依赖 brew 库："; otool -L relaymic-receiver; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: relaymic-receiver-macos
          path: relaymic-receiver
