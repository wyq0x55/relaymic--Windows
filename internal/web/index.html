<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>远程麦克风</title>
<style>
  :root {
    --bg: #0f1115;
    --fg: #e8eaed;
    --dim: #8a8f98;
    --line: #262a33;
    --ok: #35c46b;
    --warn: #e0a034;
    --err: #e05a4f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.6 -apple-system, "Segoe UI", system-ui, sans-serif;
    padding: 24px;
  }
  main { width: 100%; max-width: 380px; }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 4px; }
  .target { color: var(--dim); font-size: 13px; margin-bottom: 28px; }

  button {
    width: 100%;
    padding: 16px;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    color: var(--bg);
    background: var(--fg);
    border: 0;
    border-radius: 10px;
    cursor: pointer;
  }
  button:disabled { opacity: .4; cursor: default; }
  button.live { background: var(--err); color: #fff; }

  .meter {
    height: 4px;
    margin: 20px 0;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
  }
  .meter i {
    display: block;
    height: 100%;
    width: 0;
    background: var(--ok);
    transition: width .08s linear;
  }

  .profiles {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
  }
  .profiles button {
    flex: 1;
    padding: 8px 4px;
    font-size: 13px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: none;
    color: var(--dim);
    cursor: pointer;
  }
  .profiles button.on {
    color: inherit;
    border-color: currentColor;
    font-weight: 600;
  }

  .micstate { font-size: 13px; color: var(--dim); min-height: 18px; margin-bottom: 8px; }
  .conns {
    font-size: 13px;
    border-top: 1px solid var(--line);
    padding-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .conn { display: flex; align-items: baseline; gap: 10px; }
  .conn .host { font-variant-numeric: tabular-nums; }
  .conn .st { flex: 1; text-align: right; }
  .conn .rtt { color: var(--dim); font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; }
  .empty { color: var(--dim); }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .err { color: var(--err); }
</style>
</head>
<body>
<main>
  <h1>远程麦克风</h1>
  <div class="target" id="target">—</div>

  <div class="profiles" id="profiles"></div>

  <button id="toggle">开始说话</button>
  <div class="meter"><i id="level"></i></div>

  <div id="micstate" class="micstate"></div>
  <div id="conns" class="conns"><div class="empty">未连接</div></div>
</main>

<script>
const $ = id => document.getElementById(id);
let stream = null, statsTimer = null, rafId = null, audioCtx = null;
let live = false, discoverTimer = null;

// 每个接收端一条独立连接：各自协商、各自重连，一台挂了不影响其他台。
// conns: origin 串 -> { target, pc, retry, retryTimer, healTimer, state, cls, rtt, needCert }
const conns = new Map();

$('target').textContent = '自动发现接收端（从 ' + location.host + ' 进入）';

$('toggle').onclick = () => (live ? stop() : start());

// 音质模式：一键整组切换，不再一个参数一个参数地调。
// 三档覆盖了排查中真实出现过的三种病：降噪的水泡音、底噪、增益不当。
const PROFILES = {
  denoise: { label: '降噪', ns: true,  agc: true  }, // 环境吵、麦克风电平正常
  clean:   { label: '纯净', ns: false, agc: true  }, // 降噪出水泡音时用
  raw:     { label: '原始', ns: false, agc: false }, // 全交给接收端 AGC 处理
};
let profile = localStorage.getItem('profile');
// 兼容旧的 ?ns=0 用法
if (!PROFILES[profile]) profile = new URLSearchParams(location.search).get('ns') === '0' ? 'clean' : 'denoise';

for (const [key, p] of Object.entries(PROFILES)) {
  const b = document.createElement('button');
  b.textContent = p.label;
  b.dataset.key = key;
  b.onclick = () => switchProfile(key);
  $('profiles').appendChild(b);
}
renderProfiles();

function renderProfiles() {
  for (const b of $('profiles').children) b.classList.toggle('on', b.dataset.key === profile);
}

// 正在说话时切换：重新拿一路新约束的音轨，replaceTrack 无缝换上，
// 连接不动、不用重新协商。没在说话就只记下选择，下次开播生效。
async function switchProfile(key) {
  if (key === profile) return;
  profile = key;
  localStorage.setItem('profile', key);
  renderProfiles();
  if (!live) return;
  try {
    const next = await getMic();
    if (!live) { next.getTracks().forEach(t => t.stop()); return; }
    const old = stream;
    stream = next;
    attachMic();
    cancelAnimationFrame(rafId); rafId = null;
    if (audioCtx) { audioCtx.close(); audioCtx = null; }
    meter(stream);
    if (old) old.getTracks().forEach(t => t.stop());
  } catch (err) {
    $('micstate').textContent = explainMicError(err);
  }
}

// getMic 按当前模式拿麦克风。
// 增益交给接收端统一处理，这头只要原始一点的信号。
// 回声消除恒关：远端的声音不会绕回本地，开着只是白白增加延迟。
function getMic() {
  const p = PROFILES[profile];
  return withTimeout(
    navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: p.ns,
        autoGainControl: p.agc,
      },
    }),
    20000,
    '麦克风一直没有响应');
}

async function start() {
  live = true;
  $('toggle').textContent = '停止';
  $('toggle').classList.add('live');

  // 麦克风授权和网络协商互不依赖，串行等于把两段耗时相加。
  // 先把发现和连接跑起来（音轨后补），同时去要麦克风。
  discover();
  discoverTimer = setInterval(discover, 30000);

  try {
    // 迟迟拿不到，多半是权限提示还等在地址栏那儿，或者麦克风被别的程序占着。
    // 卡在这里却不给原因，用户只会以为产品坏了。
    const hint = setTimeout(() => {
      $('micstate').textContent = '等待麦克风授权：看一下地址栏左侧的权限提示';
    }, 2500);

    stream = await getMic();
    clearTimeout(hint);
    $('micstate').textContent = '';
  } catch (err) {
    $('micstate').textContent = explainMicError(err);
    stop();
    return;
  }
  meter(stream);
  attachMic();
}

// discover 找到所有接收端：进入页面的这台 + 它替我们扫出来的其他台。
// 浏览器自己够不到 Tailscale 设备表，这一步由接收端代劳（/api/receivers）。
async function discover() {
  if (!live) return;
  ensureConn(location.origin);
  try {
    const res = await fetch('/api/receivers');
    if (res.ok) {
      for (const t of await res.json()) ensureConn(t);
    }
  } catch { /* 拿不到列表就只连本台 */ }
}

function ensureConn(target) {
  const key = hostOf(target);
  for (const c of conns.values()) if (hostOf(c.target) === key) return;
  const c = { target, retry: 0, state: '连接中…', cls: 'warn', rtt: '' };
  conns.set(target, c);
  renderConns();
  connectOne(c);
}

function hostOf(target) {
  try { return new URL(target).hostname; } catch { return target; }
}

// attachMic 把麦克风音轨塞进所有已建好的连接。replaceTrack 不触发重新
// 协商，所以连接可以先行建立，音轨到了直接开始推流。
function attachMic() {
  if (!stream) return;
  for (const c of conns.values()) {
    if (!c.pc) continue;
    const sender = c.pc.getSenders().find(s => !s.track || s.track.kind === 'audio');
    if (sender) sender.replaceTrack(stream.getAudioTracks()[0]);
  }
}

// 每台接收端有自己的 /ice-config（同一套 TURN），跨域取。
async function loadICE(target) {
  try {
    const res = await fetch(target + '/ice-config');
    if (res.ok) return await res.json();
  } catch { /* 兜底 */ }
  return { iceServers: [{ urls: 'stun:stun.miwifi.com:3478' }] };
}

// connectOne 维持到一台接收端的连接。断了就退避重连 —— 网络恢复、
// 接收端重启、电脑睡醒，都走这一条路径，不需要人再点一次按钮。
async function connectOne(c) {
  if (!live) return;
  clearTimeout(c.retryTimer); c.retryTimer = null;
  if (c.pc) { c.pc.close(); c.pc = null; }

  try {
    setConnState(c, '建立连接…', 'warn');
    const cfg = await loadICE(c.target);
    if (cfg.name) { c.name = cfg.name; }
    const pc = new RTCPeerConnection({ iceServers: cfg.iceServers });
    c.pc = pc;
    // 先声明一条只发的音轨占住 m-line，ICE 收集立即开始；
    // 麦克风到手后由 attachMic 补上真实音轨。重连时麦克风已在手，直接塞。
    const tx = pc.addTransceiver('audio', { direction: 'sendonly' });
    if (stream) tx.sender.replaceTrack(stream.getAudioTracks()[0]);
    pc.oniceconnectionstatechange = () => {
      if (c.pc !== pc) return;
      const s = pc.iceConnectionState;
      if (s === 'connected' || s === 'completed') {
        clearTimeout(c.healTimer); c.healTimer = null;
        c.retry = 0;
        c.needCert = false;
        setConnState(c, '已连接', 'ok');
      } else if (s === 'checking') {
        setConnState(c, '连接中…', 'warn');
      } else if (s === 'disconnected') {
        // disconnected 只是"暂时收不到对方的包"，ICE 自己会重试并且多半能恢复。
        setConnState(c, '网络波动，等待恢复…', 'warn');
        if (!c.healTimer) {
          c.healTimer = setTimeout(() => {
            c.healTimer = null;
            const now = c.pc && c.pc.iceConnectionState;
            if (now !== 'connected' && now !== 'completed') scheduleRetry(c, '长时间未恢复');
          }, 8000);
        }
      } else if (s === 'failed' || s === 'closed') {
        clearTimeout(c.healTimer); c.healTimer = null;
        scheduleRetry(c, s === 'failed' ? '连接失败' : '连接关闭');
      }
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    // 等候选收集，但最多等 3 秒：STUN 不通时别陪浏览器等满 10 秒。
    await new Promise(done => {
      if (pc.iceGatheringState === 'complete') return done();
      const cap = setTimeout(done, 3000);
      pc.onicegatheringstatechange = () => {
        if (pc.iceGatheringState === 'complete') { clearTimeout(cap); done(); }
      };
    });

    setConnState(c, '协商中…', 'warn');
    const res = await fetch(c.target + '/offer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(pc.localDescription),
    });
    if (!res.ok) throw new Error(await res.text());
    await pc.setRemoteDescription(await res.json());

    if (!statsTimer) statsTimer = setInterval(poll, 1000);
  } catch (err) {
    // 跨域 fetch 直接炸（TypeError）而目标不是本台：八成是那台的
    // 自签证书还没被这个浏览器接受过 —— 提示点开一次，重连会自己接上。
    if (err instanceof TypeError && hostOf(c.target) !== location.hostname) {
      c.needCert = true;
    }
    scheduleRetry(c, err.message);
  }
}

function scheduleRetry(c, why) {
  if (!live || c.retryTimer) return;
  const delay = Math.min(1000 * 2 ** c.retry, 15000);
  c.retry++;
  setConnState(c, `${why}，${Math.round(delay / 1000)}s 后重连`, 'warn');
  c.retryTimer = setTimeout(() => { c.retryTimer = null; connectOne(c); }, delay);
}

function stop() {
  live = false;
  clearInterval(discoverTimer); discoverTimer = null;
  clearInterval(statsTimer); statsTimer = null;
  cancelAnimationFrame(rafId); rafId = null;
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  for (const c of conns.values()) {
    clearTimeout(c.retryTimer);
    clearTimeout(c.healTimer);
    if (c.pc) c.pc.close();
  }
  conns.clear();
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  $('toggle').textContent = '开始说话';
  $('toggle').classList.remove('live');
  $('level').style.width = '0';
  $('micstate').textContent = '';
  renderConns();
}

function setConnState(c, text, cls) {
  c.state = text;
  c.cls = cls || '';
  renderConns();
}

function renderConns() {
  const box = $('conns');
  if (conns.size === 0) {
    box.innerHTML = '<div class="empty">未连接</div>';
    return;
  }
  box.innerHTML = [...conns.values()].map(c => `
    <div class="conn">
      <span class="host">${c.name ? c.name + ' · ' : ''}${hostOf(c.target)}</span>
      <span class="st ${c.cls}">${c.needCert
        ? `无法访问 —— 首次需<a href="${c.target}" target="_blank">点此打开一次</a>接受证书`
        : c.state}</span>
      <span class="rtt">${c.rtt}</span>
    </div>`).join('');
}

function withTimeout(promise, ms, message) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(message)), ms)),
  ]);
}

// 浏览器的原始报错对用户毫无意义，翻译成"该去动哪里"。
function explainMicError(err) {
  const name = err.name || '';
  if (name === 'NotAllowedError') return '麦克风被拒绝：点地址栏左侧图标改成允许';
  if (name === 'NotFoundError') return '这台机器上没找到麦克风';
  if (name === 'NotReadableError') return '麦克风被别的程序占着：关掉会议/录音软件和其他标签页';
  if (name === 'OverconstrainedError') return '麦克风不支持所需参数';
  return '拿不到麦克风：' + (err.message || name || '未知原因');
}

// 本地电平表：先确认自己这头真的在采到声音，再去怀疑网络。
function meter(stream) {
  audioCtx = new AudioContext();
  const analyser = audioCtx.createAnalyser();
  analyser.fftSize = 1024;
  audioCtx.createMediaStreamSource(stream).connect(analyser);
  const buf = new Float32Array(analyser.fftSize);
  (function tick() {
    analyser.getFloatTimeDomainData(buf);
    let sum = 0;
    for (const v of buf) sum += v * v;
    const rms = Math.sqrt(sum / buf.length);
    $('level').style.width = Math.min(100, rms * 300) + '%';
    rafId = requestAnimationFrame(tick);
  })();
}

// poll 每秒扫一遍所有连接的统计，把 RTT（和中继标记）写进各自的行。
async function poll() {
  let dirty = false;
  for (const c of conns.values()) {
    if (!c.pc || c.pc.connectionState === 'closed') continue;
    const stats = await c.pc.getStats();
    let pair = null;
    stats.forEach(r => {
      if (r.type === 'candidate-pair' && r.state === 'succeeded' && r.nominated !== false) pair = r;
    });
    if (pair && pair.currentRoundTripTime != null) {
      const local = stats.get(pair.localCandidateId);
      const rem = stats.get(pair.remoteCandidateId);
      const relayed = local?.candidateType === 'relay' || rem?.candidateType === 'relay';
      const txt = Math.round(pair.currentRoundTripTime * 1000) + 'ms' + (relayed ? ' 中继' : '');
      if (txt !== c.rtt) { c.rtt = txt; dirty = true; }
    }
  }
  if (dirty) renderConns();
}

addEventListener('pagehide', stop);
</script>
</body>
</html>
