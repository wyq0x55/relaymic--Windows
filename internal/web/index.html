<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>远程麦克风</title>
<style>
  :root {
    --bg: #0f1115;
    --fg: #e8eaed;
    --dim: #8a8f98;
    --line: #262a33;
    --ok: #35c46b;
    --warn: #e0a034;
    --err: #e05a4f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.6 -apple-system, "Segoe UI", system-ui, sans-serif;
    padding: 24px;
  }
  main { width: 100%; max-width: 380px; }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 4px; }
  .target { color: var(--dim); font-size: 13px; margin-bottom: 24px; }

  .code { display: flex; gap: 8px; margin-bottom: 12px; }
  .code input {
    flex: 1;
    min-width: 0;
    padding: 14px;
    font: 600 22px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .26em;
    text-align: center;
    color: var(--fg);
    background: #171a21;
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .code input:focus { outline: none; border-color: var(--dim); }

  button {
    padding: 16px;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    color: var(--bg);
    background: var(--fg);
    border: 0;
    border-radius: 10px;
    cursor: pointer;
    width: 100%;
  }
  button:disabled { opacity: .4; cursor: default; }
  button.live { background: var(--err); color: #fff; }
  .code button { width: auto; padding: 14px 18px; font-size: 15px; }

  .meter {
    height: 4px;
    margin: 20px 0;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
  }
  .meter i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .08s linear; }

  .profiles { display: flex; gap: 6px; margin-bottom: 12px; }
  .profiles button {
    flex: 1;
    padding: 8px 4px;
    font-size: 13px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: none;
    color: var(--dim);
    cursor: pointer;
  }
  .profiles button.on { color: inherit; border-color: currentColor; font-weight: 600; }

  .micstate { font-size: 13px; color: var(--dim); min-height: 18px; margin-bottom: 8px; }
  .return { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--dim); margin-bottom: 8px; }
  .return input { flex: 1; min-width: 0; accent-color: var(--fg); }
  .return .ok { color: var(--ok); }
  .conns {
    font-size: 13px;
    border-top: 1px solid var(--line);
    padding-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .conn { display: flex; align-items: baseline; gap: 10px; }
  .conn .host { font-variant-numeric: tabular-nums; }
  .conn .st { flex: 1; text-align: right; }
  .conn .rtt { color: var(--dim); font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .err { color: var(--err); }
  .src { margin-top: 28px; text-align: center; font-size: 12px; opacity: .45; }
  .src a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>远程麦克风</h1>
  <div class="target" id="target">—</div>

  <div class="code">
    <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="7"
           placeholder="配对码" aria-label="配对码">
    <button id="pair">连接</button>
  </div>

  <div class="profiles" id="profiles"></div>

  <button id="toggle" disabled>开始说话</button>
  <div class="meter"><i id="level"></i></div>

  <div id="micstate" class="micstate"></div>
  <div class="return">
    <span id="returnstate">回传：未开始</span>
    <input id="volume" type="range" min="0" max="100" value="100" aria-label="对面音量">
  </div>
  <!-- 公司电脑上 Teams 的声音从这条音轨回来。它不依赖"开始说话"：
       只听不说是正常用法。 -->
  <audio id="remote" autoplay></audio>

  <div class="conns">
    <div class="conn">
      <span class="host" id="peer">未配对</span>
      <span class="st" id="state">—</span>
      <span class="rtt" id="rtt"></span>
    </div>
  </div>

  <!-- AGPL-3.0 第 13 条：通过网络与本程序交互的用户，必须能拿到对应版本的源码。
       发送端就是这个网页，所以链接放在这儿，不是可选的装饰。
       你要是改了这份代码再给别人用，请把这个链接指向你自己那份。 -->
  <footer class="src">
    RelayMic · <a href="https://github.com/hueshu/relaymic" target="_blank" rel="noopener">源码 (AGPL-3.0)</a>
  </footer>
</main>

<script>
const $ = id => document.getElementById(id);

// /api/ice 只放公开 STUN。成功配对后，Hub 才会在 paired 消息里下发这条
// 会话专属的 TURN 凭据，页面不需要知道 coturn 的共享密钥。
let iceServers = [{ urls: 'stun:stun.miwifi.com:3478' }];

let ws = null, pc = null, session = null, peerName = '';
let stream = null, live = false, statsTimer = null, rafId = null, audioCtx = null;
let paired = false;
const remoteAudio = $('remote');

$('target').textContent = location.host;

fetch('/api/ice')
  .then(res => (res.ok ? res.json() : null))
  .then(cfg => {
    if (cfg && Array.isArray(cfg.iceServers) && cfg.iceServers.length) iceServers = cfg.iceServers;
  })
  .catch(() => { /* 拿不到就用兜底 STUN */ });

// 配对码是 6 位数字；输入时按 3+3 分组，方便照着念。
$('code').addEventListener('input', () => {
  const digits = $('code').value.replace(/[^0-9]/g, '').slice(0, 6);
  $('code').value = digits.length > 3 ? digits.slice(0, 3) + ' ' + digits.slice(3) : digits;
});

$('pair').onclick = () => (paired ? disconnect('已断开') : pair());
$('toggle').onclick = () => (live ? stopMic() : startMic());
$('volume').oninput = () => { remoteAudio.volume = $('volume').value / 100; };

// 音质模式：一键整组切换。三档覆盖了排查中真实出现过的三种病：
// 降噪的水泡音、底噪、增益不当。
const PROFILES = {
  denoise: { label: '降噪', ns: true,  agc: true  },
  clean:   { label: '纯净', ns: false, agc: true  },
  raw:     { label: '原始', ns: false, agc: false },
};
let profile = localStorage.getItem('profile');
if (!PROFILES[profile]) profile = 'denoise';

for (const key of Object.keys(PROFILES)) {
  const b = document.createElement('button');
  b.textContent = PROFILES[key].label;
  b.onclick = () => { profile = key; localStorage.setItem('profile', key); renderProfiles(); };
  b.dataset.key = key;
  $('profiles').appendChild(b);
}

function renderProfiles() {
  for (const b of $('profiles').children) b.classList.toggle('on', b.dataset.key === profile);
}
renderProfiles();

function setState(text, cls) {
  $('state').textContent = text;
  $('state').className = 'st ' + (cls || '');
}

function pair() {
  const code = $('code').value.replace(/[^0-9]/g, '');
  if (code.length !== 6) { setState('配对码是 6 位数字', 'err'); return; }
  teardownPeer();
  paired = false;
  $('pair').disabled = true;
  $('peer').textContent = '配对中…';
  setState('连接控制面…', 'warn');

  const scheme = location.protocol === 'https:' ? 'wss://' : 'ws://';
  ws = new WebSocket(scheme + location.host + '/ws/sender');
  ws.onopen = () => ws.send(JSON.stringify({ type: 'pair', code }));
  ws.onmessage = ev => handle(JSON.parse(ev.data));
  ws.onerror = () => setState('控制面连接失败', 'err');
  ws.onclose = () => {
    $('pair').disabled = false;
    if (paired) {
      // 会话随连接一起结束：接收端那边已经换成了新码。
      disconnect('会话已结束，请让接收端提供新的配对码');
    } else if ($('state').className.indexOf('err') < 0) {
      setState('控制面连接已关闭', 'err');
    }
  };
}

function handle(msg) {
  switch (msg.type) {
    case 'paired':
      session = msg.session;
      peerName = msg.name || '接收端';
      if (Array.isArray(msg.iceServers) && msg.iceServers.length) iceServers = msg.iceServers;
      paired = true;
      $('peer').textContent = peerName;
      $('pair').disabled = false;
      $('pair').textContent = '断开';
      negotiate();
      break;
    case 'answer':
      if (!pc) return;
      pc.setRemoteDescription(msg.sdp)
        .then(() => { if (!statsTimer) statsTimer = setInterval(poll, 1000); })
        .catch(err => setState('协商失败：' + err.message, 'err'));
      break;
    case 'error':
      setState(msg.error || '配对失败', 'err');
      break;
    case 'closed':
      disconnect(msg.error || '接收端已离线');
      break;
  }
}

async function negotiate() {
  setState('协商中…', 'warn');
  pc = new RTCPeerConnection({ iceServers });

  // 两条音频通道，顺序不能换：接收端按 m-line 顺序对通道，
  // 第一条必须是"我们推麦克风"，第二条才是"我们听对面"。
  // 第一条先占住只发不收的音轨，ICE 收集立刻开始，麦克风到手后再补真实音轨。
  const tx = pc.addTransceiver('audio', { direction: 'sendonly' });
  if (stream) tx.sender.replaceTrack(stream.getAudioTracks()[0]);
  pc.addTransceiver('audio', { direction: 'recvonly' });

  // 对面推过来的那条音轨，就是公司电脑上 Teams 的声音。
  pc.ontrack = ev => {
    if (ev.track.kind !== 'audio') return;
    remoteAudio.srcObject = ev.streams[0] || new MediaStream([ev.track]);
    remoteAudio.volume = $('volume').value / 100;
    $('returnstate').textContent = '回传：已连接';
    $('returnstate').className = 'ok';
    // 自动播放要用户手势。进到这个页面时已经点过"连接"，通常直接就能响；
    // 被拦下时把话说清楚，别让用户以为对面没声音。
    remoteAudio.play().catch(() => {
      $('returnstate').textContent = '回传：点一下页面开始播放';
    });
  };

  pc.oniceconnectionstatechange = () => {
    const s = pc && pc.iceConnectionState;
    if (s === 'connected' || s === 'completed') { setState('已连接', 'ok'); $('toggle').disabled = false; }
    else if (s === 'checking') setState('打洞中…', 'warn');
    else if (s === 'disconnected') setState('网络波动…', 'warn');
    else if (s === 'failed') setState('媒体连接失败：双方都在 NAT 后时需要 TURN（#3）', 'err');
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  // 等候选收集，但最多 3 秒：STUN 不通时别陪浏览器等满 10 秒。
  await new Promise(done => {
    if (pc.iceGatheringState === 'complete') return done();
    const cap = setTimeout(done, 3000);
    pc.onicegatheringstatechange = () => {
      if (pc.iceGatheringState === 'complete') { clearTimeout(cap); done(); }
    };
  });
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'offer', sdp: pc.localDescription }));
  }
}

async function startMic() {
  $('micstate').textContent = '正在申请麦克风…';
  try {
    const want = PROFILES[profile];
    stream = await withTimeout(
      navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: want.ns,
          noiseSuppression: want.ns,
          autoGainControl: want.agc,
          channelCount: 1,
        },
      }),
      20000,
      '麦克风授权超时',
    );
  } catch (err) {
    $('micstate').textContent = explainMicError(err);
    return;
  }

  live = true;
  $('toggle').textContent = '停止';
  $('toggle').classList.add('live');
  $('micstate').textContent = '正在采集这台设备的声音';
  meter(stream);
  attachMic();
}

function stopMic() {
  live = false;
  cancelAnimationFrame(rafId); rafId = null;
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  if (pc) {
    const sender = pc.getSenders().find(s => s.track && s.track.kind === 'audio');
    if (sender) sender.replaceTrack(null);
  }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  $('toggle').textContent = '开始说话';
  $('toggle').classList.remove('live');
  $('micstate').textContent = '';
  $('level').style.width = '0';
}

// attachMic 把麦克风音轨塞进已建好的连接。replaceTrack 不触发重新协商，
// 所以可以先配对、后开麦。
function attachMic() {
  if (!stream || !pc) return;
  const sender = pc.getSenders().find(s => !s.track || s.track.kind === 'audio');
  if (sender) sender.replaceTrack(stream.getAudioTracks()[0]);
}

function disconnect(reason) {
  teardownPeer();
  paired = false;
  session = null;
  $('pair').textContent = '连接';
  $('pair').disabled = false;
  $('peer').textContent = '未配对';
  $('toggle').disabled = true;
  setState(reason || '已断开', 'warn');
}

function teardownPeer() {
  clearInterval(statsTimer); statsTimer = null;
  if (pc) { pc.close(); pc = null; }
  if (ws) {
    const sock = ws;
    ws = null;
    sock.onclose = null;
    try { sock.close(); } catch { /* 已经关了 */ }
  }
  $('rtt').textContent = '';
  remoteAudio.srcObject = null;
  $('returnstate').textContent = '回传：未开始';
  $('returnstate').className = '';
}

// 本地电平表：先确认自己这头真的在采到声音，再去怀疑网络。
function meter(s) {
  audioCtx = new AudioContext();
  const analyser = audioCtx.createAnalyser();
  analyser.fftSize = 1024;
  audioCtx.createMediaStreamSource(s).connect(analyser);
  const buf = new Float32Array(analyser.fftSize);
  (function tick() {
    analyser.getFloatTimeDomainData(buf);
    let sum = 0;
    for (const v of buf) sum += v * v;
    const rms = Math.sqrt(sum / buf.length);
    $('level').style.width = Math.min(100, rms * 300) + '%';
    rafId = requestAnimationFrame(tick);
  })();
}

async function poll() {
  if (!pc) return;
  let stats;
  try { stats = await pc.getStats(); } catch { return; }
  stats.forEach(r => {
    if (r.type === 'candidate-pair' && r.state === 'succeeded' && r.currentRoundTripTime != null) {
      $('rtt').textContent = Math.round(r.currentRoundTripTime * 1000) + ' ms';
    }
  });
}

function withTimeout(promise, ms, message) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(message)), ms)),
  ]);
}

// 浏览器的原始报错对用户毫无意义，翻译成"该去动哪里"。
function explainMicError(err) {
  const name = err.name || '';
  if (name === 'NotAllowedError') return '麦克风被拒绝：点地址栏左侧图标改成允许';
  if (name === 'NotFoundError') return '这台机器上没找到麦克风';
  if (name === 'NotReadableError') return '麦克风被别的程序占着：关掉会议/录音软件和其他标签页';
  if (name === 'OverconstrainedError') return '麦克风不支持所需参数';
  return '拿不到麦克风：' + (err.message || name || '未知原因');
}
</script>
</body>
</html>
