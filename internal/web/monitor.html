<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>接收监控</title>
<style>
  :root {
    --bg: #0f1115;
    --fg: #e8eaed;
    --dim: #8a8f98;
    --line: #262a33;
    --ok: #35c46b;
    --warn: #e0a034;
    --err: #e05a4f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.6 -apple-system, "Segoe UI", system-ui, sans-serif;
    padding: 24px;
  }
  main { width: 100%; max-width: 520px; margin: 0 auto; }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 20px; }

  .card {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .card h2 {
    font-size: 13px;
    font-weight: 600;
    color: var(--dim);
    margin: 0 0 12px;
  }
  .code { font: 700 34px/1.1 ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .16em; font-variant-numeric: tabular-nums; }
  .hint { color: var(--dim); font-size: 13px; margin-top: 8px; }
  button { margin-top: 12px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 7px; background: #1b202a; color: var(--fg); font: inherit; cursor: pointer; }
  button:disabled { cursor: default; color: var(--dim); }

  #state { font-size: 15px; font-weight: 600; }
  #path { color: var(--dim); font-size: 13px; margin: 4px 0 16px; word-break: break-all; }

  .meter {
    height: 4px;
    margin-bottom: 16px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
  }
  .meter i {
    display: block;
    height: 100%;
    width: 0;
    background: var(--ok);
    transition: width .2s linear;
  }

  .stats { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--dim); }
  .stats b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
  .config { display: grid; grid-template-columns: 96px 1fr; gap: 5px 12px; font-size: 13px; }
  .config dt { color: var(--dim); }
  .config dd { margin: 0; overflow-wrap: anywhere; }

  .ok { color: var(--ok); } .warn { color: var(--warn); } .err { color: var(--err); }
</style>
</head>
<body>
<main>
  <h1>接收监控</h1>

  <div class="card">
    <h2>一次性配对码</h2>
    <div id="code" class="code">—— ——</div>
    <div id="codeHint" class="hint">等待 Hub 下发配对码</div>
    <button id="copyCode" type="button" disabled>复制配对码</button>
  </div>

  <div class="card">
    <div id="state" class="warn">—</div>
    <div id="path">—</div>
    <div class="meter"><i id="level"></i></div>
    <div class="stats">
      <span>缓冲 <b id="buffered">—</b></span>
      <span>丢弃 <b id="dropped">—</b></span>
      <span>欠载 <b id="starved">—</b></span>
      <span>收包 <b id="received">—</b></span>
      <span>丢包 <b id="lost">—</b></span>
    </div>
    <button id="closeSession" type="button" disabled>断开当前通话</button>
  </div>

  <div class="card">
    <h2>运行配置</h2>
    <dl class="config">
      <dt>Hub</dt><dd id="hub">—</dd>
      <dt>输出设备</dt><dd id="outputDevice">—</dd>
      <dt>回传</dt><dd id="returnSource">—</dd>
      <dt>中继模式</dt><dd id="relayMode">—</dd>
    </dl>
  </div>

</main>

<script>
const $ = id => document.getElementById(id);
let pairingCode = '';

// 接收端多数故障（进程没起、局域网断了）会让 fetch 直接抛错而不是返回非 200，
// 两种情况一律归一成"离线"，用户不用分辨是哪一种。
async function pollStatus() {
  try {
    const res = await fetch('/api/status');
    if (!res.ok) throw new Error(String(res.status));
    renderStatus(await res.json());
  } catch {
    renderOffline();
  }
}

function renderStatus(s) {
  const connected = s.state === 'connected';
  $('state').textContent = s.state || '—';
  $('state').className = connected ? 'ok' : 'warn';
  $('path').textContent = s.path || '—';

  // dBFS 是负数，-60 视为静音、0 视为削波，线性映射成宽度。
  const db = typeof s.levelDb === 'number' ? s.levelDb : -60;
  $('level').style.width = Math.max(0, Math.min(100, (db + 60) / 60 * 100)) + '%';

  $('buffered').textContent = s.bufferedMs != null ? s.bufferedMs + ' ms' : '—';
  $('dropped').textContent = s.dropped ?? '—';
  $('starved').textContent = s.starved ?? '—';
  $('received').textContent = s.received ?? '—';
  $('lost').textContent = s.lost ?? '—';

  renderPairing(s.pairing || {});
  $('hub').textContent = s.hub || '—';
  $('outputDevice').textContent = s.outputDevice || '—';
  $('returnSource').textContent = s.returnSource ? `${s.returnMode || '回传'}：${s.returnSource}` : '未配置';
  $('relayMode').textContent = s.forceRelay ? '强制 TURN 中继' : '自动（直连优先）';
  $('closeSession').disabled = !s.sessionActive;
}

function renderPairing(pairing) {
  pairingCode = pairing.code || '';
  if (!pairing.active) {
    $('code').textContent = '—— ——';
    $('codeHint').textContent = '等待 Hub 下发配对码';
  } else if (pairing.hidden) {
    $('code').textContent = '已隐藏';
    $('codeHint').textContent = '配对码仅在 Receiver 本机浏览器显示';
  } else {
    $('code').textContent = pairingCode.slice(0, 3) + ' ' + pairingCode.slice(3);
    $('codeHint').textContent = `剩余 ${formatCountdown(pairing.expiresInSec)}；用过即失效`;
  }
  $('copyCode').disabled = !pairingCode;
}

function formatCountdown(seconds) {
  seconds = Math.max(0, Number(seconds) || 0);
  return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;
}

$('copyCode').onclick = async () => {
  if (!pairingCode) return;
  try {
    await navigator.clipboard.writeText(pairingCode);
    $('codeHint').textContent = '已复制；用过即失效';
  } catch {
    $('codeHint').textContent = '复制失败，请手动输入配对码';
  }
};

// 断开是写操作：带上自定义头，服务端据此拒绝浏览器里其他页面发起的 POST。
$('closeSession').onclick = async () => {
  $('closeSession').disabled = true;
  try {
    const res = await fetch('/api/session/close', { method: 'POST', headers: { 'X-RelayMic': '1' } });
    $('codeHint').textContent = res.ok ? '已断开；新配对码马上到' : `断开失败：HTTP ${res.status}`;
  } catch {
    $('codeHint').textContent = '断开失败：本机控制台无响应';
  }
};

function renderOffline() {
  $('state').textContent = '接收端离线';
  $('state').className = 'err';
  $('path').textContent = '—';
  $('level').style.width = '0';
  $('buffered').textContent = $('dropped').textContent = $('starved').textContent =
    $('received').textContent = $('lost').textContent = '—';
  renderPairing({});
  $('closeSession').disabled = true;
  $('hub').textContent = $('outputDevice').textContent = $('returnSource').textContent = $('relayMode').textContent = '—';
}

pollStatus();
setInterval(pollStatus, 1000);

</script>
</body>
</html>
